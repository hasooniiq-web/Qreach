# /etc/nginx/snippets/qreach-hardening.conf  (server context; included by the qreach site)

# Everything: a person never gets near 20 requests a second; a script does.
limit_req  zone=qreach_all burst=80 nodelay;
limit_conn qreach_conn 40;

# Account sign-in, registration and one-time codes: one request a second per address,
# a short burst allowed (the app may send two or three in a row).
location ^~ /api/v1/auth/ {
    limit_req  zone=qreach_auth burst=8 nodelay;
    limit_req  zone=qreach_all  burst=80 nodelay;
    limit_conn qreach_conn 40;
    try_files  $uri /index.php?$query_string;
}

# Dashboard sign-in and its authenticator step.
location ~ ^/admin/(login|totp/verify|totp/setup)$ {
    limit_req  zone=qreach_auth burst=6 nodelay;
    limit_req  zone=qreach_all  burst=80 nodelay;
    limit_conn qreach_conn 40;
    try_files  $uri /index.php?$query_string;
}

# Public forms: contact us and the reseller look-up.
location ~ ^/(contact|reseller)$ {
    limit_req  zone=qreach_form burst=6 nodelay;
    limit_req  zone=qreach_all  burst=80 nodelay;
    limit_conn qreach_conn 40;
    try_files  $uri /index.php?$query_string;
}
