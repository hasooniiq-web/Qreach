# /etc/nginx/conf.d/qreach-limits.conf  (http context)
#
# Flooding protection for the Qreach site. The zones are *declared* here; the
# server block uses them through snippets/qreach-hardening.conf.
#
# Sizes: 10m of shared memory holds about 160,000 client addresses per zone.

limit_req_zone  $binary_remote_addr zone=qreach_all:10m   rate=20r/s;   # every request
limit_req_zone  $binary_remote_addr zone=qreach_auth:10m  rate=1r/s;    # sign-in, OTP, register
limit_req_zone  $binary_remote_addr zone=qreach_form:10m  rate=30r/m;   # contact form, reseller look-up
limit_conn_zone $binary_remote_addr zone=qreach_conn:10m;

# A blocked request is "429 Too Many Requests", not "503", and is logged at warn
# level so fail2ban's nginx-limit-req jail can see the repeat offenders.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# Slow-loris style attacks hold connections open by trickling bytes.
client_header_timeout 15s;
client_body_timeout   15s;
send_timeout          30s;
reset_timedout_connection on;
client_header_buffer_size 2k;
large_client_header_buffers 4 8k;
