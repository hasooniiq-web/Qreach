org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler cache computes relative paths between the
# Gradle project dir and the Gradle/pub caches; on Windows when the project
# lives on a different drive letter than those caches, that relativization
# throws ("this and base files have different roots"). Disabling incremental
# compilation avoids it — a real toolchain limitation hit during development
# on this machine, not an app bug. Safe to remove if the project and caches
# are later moved onto the same drive.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
