include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
    # require_trailing_commas deliberately omitted: it fights `dart format`'s
    # own decision to keep short argument lists on one line without a
    # trailing comma, producing dozens of info-level lints on correctly
    # formatted code.

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
