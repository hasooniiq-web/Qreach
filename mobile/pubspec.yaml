name: qreach_smarttag
description: "Qreach SmartTag — customer mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage (Android Keystore / iOS Keychain backed)
  flutter_secure_storage: ^9.2.2

  # QR scanning
  mobile_scanner: ^6.0.6

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Icons: Material Icons (bundled with Flutter, no external package —
  # avoids the phosphor_flutter incompatibility found during development,
  # see docs/ARCHITECTURE_DECISIONS.md). No emoji as structural icons.

  # Typography — Lateef bundled locally so it works offline.
  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lateef-500.ttf
          weight: 500
        - asset: assets/fonts/Lateef-600.ttf
          weight: 600
        - asset: assets/fonts/Lateef-700.ttf
          weight: 700
        - asset: assets/fonts/Lateef-800.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/vehicles/
