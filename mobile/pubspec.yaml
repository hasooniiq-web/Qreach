name: qreach_smarttag
description: "Qreach SmartTag — customer mobile app"
publish_to: 'none'
version: 0.1.0+18

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage (Android Keystore / iOS Keychain backed)
  flutter_secure_storage: ^9.2.2

  # QR scanning
  mobile_scanner: ^6.0.6

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Icons: Material Icons (bundled with Flutter, no external package —
  # avoids the phosphor_flutter incompatibility found during development,
  # see docs/ARCHITECTURE_DECISIONS.md). No emoji as structural icons.

  # Typography — IBM Plex Sans Arabic via Google Fonts (fetched/cached at
  # runtime). For a fully offline-first build, replace with bundled .ttf
  # assets before shipping — see docs note in core/theme/app_theme.dart.
  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  nfc_manager: ^4.2.1

  # Face ID / fingerprint unlock as an opt-in alternative to retyping the
  # password on each app open.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  # White, not transparent: iOS doesn't allow an alpha channel in its icon,
  # and a plain white background matches the brand mark's own card.
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive_fg.png"

flutter:
  uses-material-design: true
  generate: true

  # CocoaPods only. With Swift Package Manager also on, Firebase was linked twice
  # on iOS (once statically via SwiftPM, once as Pods frameworks): two copies of
  # GoogleUtilities/FBLPromises, and the copy that asked for the APNs token was
  # not the one that received it, so push never got an FCM token.
  config:
    enable-swift-package-manager: false

  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/vehicles/
